[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yass"
version = "0.1.0"
description = "Yet Another Software Suite - Python port"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["yagsl", "yams", "units"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]     # Allow auto-fixes

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[mypy]
check_untyped_defs = true
