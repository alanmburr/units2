[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "units2"
version = "0.1.0"
description = "WPILib's Java Units Library - Python port"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["units2*"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[mypy]
check_untyped_defs = true
